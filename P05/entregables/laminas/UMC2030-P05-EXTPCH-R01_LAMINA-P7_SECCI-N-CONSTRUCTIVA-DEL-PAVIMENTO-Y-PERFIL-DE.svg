<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>
<rect x="0.0" y="0.0" width="1000.0" height="26.0" rx="0" fill="#0b3a66" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="10.0" y="17.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="bold">UMC-PCH-P-7 — SECCIÓN CONSTRUCTIVA DEL PAVIMENTO Y PERFIL DE COLECTORES</text>
<text x="990.0" y="17.0" font-size="9" fill="#cfe0f0" text-anchor="end">UMC2030-P05-EXTPCH-R01</text>
<text x="210.0" y="98.0" font-size="12" fill="#0b3a66" text-anchor="middle" font-weight="bold">EXISTENTE 1951 — dañado</text>
<rect x="60.0" y="110.0" width="300.0" height="42.0" rx="0" fill="#c9cfd6" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="135.0" font-size="10" fill="#1c2b36" text-anchor="start">Losa concreto e≈15 cm, acabado granítico martelinado (1951)</text>
<rect x="60.0" y="152.0" width="300.0" height="10.0" rx="0" fill="#8a6b4a" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="161.0" font-size="10" fill="#1c2b36" text-anchor="start">Juntas bituminosas + flejes (sellos perdidos)</text>
<rect x="60.0" y="162.0" width="300.0" height="34.0" rx="0" fill="#e0d2b8" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="183.0" font-size="10" fill="#1c2b36" text-anchor="start">Subbase granular / rellenos (asentada s/ zanjas)</text>
<rect x="60.0" y="196.0" width="300.0" height="22.0" rx="0" fill="#b8c9d9" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="211.0" font-size="10" fill="#1c2b36" text-anchor="start">Colectores enterrados antiguos (fugas presuntas)</text>
<text x="210.0" y="348.0" font-size="12" fill="#0b3a66" text-anchor="middle" font-weight="bold">PROPUESTO P05 — Rev.0</text>
<rect x="60.0" y="360.0" width="300.0" height="42.0" rx="0" fill="#9fc4e8" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="385.0" font-size="10" fill="#1c2b36" text-anchor="start">Losa concreto MR según diseño, e por calcular — acabado reintegrado</text>
<rect x="60.0" y="402.0" width="300.0" height="10.0" rx="0" fill="#5f8fbf" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="411.0" font-size="10" fill="#1c2b36" text-anchor="start">Sello elastomérico PU bicomp. UV/salinidad + backer rod</text>
<rect x="60.0" y="412.0" width="300.0" height="34.0" rx="0" fill="#d9c9a3" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="433.0" font-size="10" fill="#1c2b36" text-anchor="start">Subbase mejorada compactada + geotextil (saneada)</text>
<rect x="60.0" y="446.0" width="300.0" height="22.0" rx="0" fill="#7aa7cf" fill-opacity="1" stroke="#5a6b7a" stroke-width="0.8"/>
<text x="370.0" y="461.0" font-size="10" fill="#1c2b36" text-anchor="start">PEAD doble pared SN8 Ø300–400 mm + tanquillas nuevas</text>
<rect x="560.0" y="140.0" width="400.0" height="300.0" rx="0" fill="#fff" fill-opacity="1" stroke="#28506e" stroke-width="1"/>
<text x="570.0" y="162.0" font-size="11" fill="#0b3a66" text-anchor="start" font-weight="bold">Criterios del paquete propuesto:</text>
<text x="570.0" y="186.0" font-size="10.5" fill="#1c2b36" text-anchor="start">• Junta sísmica de desacople perimetral e=25–50 mm</text>
<text x="570.0" y="210.0" font-size="10.5" fill="#1c2b36" text-anchor="start">  contra Fracciones 1/2 y cabezales (≈980 m de sellado)</text>
<text x="570.0" y="234.0" font-size="10.5" fill="#1c2b36" text-anchor="start">• Retícula de paños compatible con módulos 4,00 m</text>
<text x="570.0" y="258.0" font-size="10.5" fill="#1c2b36" text-anchor="start">• Pendiente 1,2–1,5 % hacia canaletas perimetrales</text>
<text x="570.0" y="282.0" font-size="10.5" fill="#1c2b36" text-anchor="start">• Espesor y MR: CONDICIONADOS a geotecnia</text>
<text x="570.0" y="306.0" font-size="10.5" fill="#1c2b36" text-anchor="start">  (calicatas + PDC) → RFI-GEOT-01</text>
<text x="570.0" y="330.0" font-size="10.5" fill="#1c2b36" text-anchor="start">• Acabado: reintegración granítico/martelinado</text>
<text x="570.0" y="354.0" font-size="10.5" fill="#1c2b36" text-anchor="start">  con junta-testigo datada (R9 distinguibilidad)</text>
<text x="570.0" y="378.0" font-size="10.5" fill="#1c2b36" text-anchor="start">• Durabilidad marina: sellos UV, rejillas AISI 316/</text>
<text x="570.0" y="402.0" font-size="10.5" fill="#1c2b36" text-anchor="start">  fundición dúctil C250, sin pares galvánicos</text>
<text x="60.0" y="580.0" font-size="9" fill="#5a6b7a" text-anchor="start">[FUENTE: Ficha EXT-PCH-04 — dictamen y partidas E-1.01…E6.01] · [HIPÓTESIS: espesores esquemáticos, no constructivos]</text>
<rect x="6.0" y="6.0" width="988.0" height="768.0" rx="0" fill="none" fill-opacity="1" stroke="#0b3a66" stroke-width="2"/>
<line x1="6.0" y1="648.0" x2="994.0" y2="648.0" stroke="#0b3a66" stroke-width="1.5"/>
<rect x="6.0" y="648.0" width="988.0" height="126.0" rx="0" fill="#f4f7fa" fill-opacity="1" stroke="#28506e" stroke-width="1"/>
<text x="20.0" y="670.0" font-size="10" fill="#0b3a66" text-anchor="start" font-weight="bold">UNIVERSIDAD MARÍTIMA DEL CARIBE — PLAN MAESTRO UMC 2025–2030</text>
<text x="20.0" y="688.0" font-size="9" fill="#5a6b7a" text-anchor="start">PATIO / CUBIERTA DE HONOR (EXT-PCH-04) · PROA CENTRAL · Catia La Mar</text>
<text x="20.0" y="706.0" font-size="10" fill="#0b3a66" text-anchor="start" font-weight="bold">LÁMINA UMC-PCH-P-7 — SECCIÓN CONSTRUCTIVA DEL PAVIMENTO Y PERFIL DE COLECTORES</text>
<text x="20.0" y="724.0" font-size="8" fill="#5a6b7a" text-anchor="start">Paquete existente vs propuesto · espesores preliminares [HIPÓTESIS] condicionados a RFI-GEOT-01</text>
<line x1="686.0" y1="648.0" x2="686.0" y2="774.0" stroke="#28506e" stroke-width="1"/>
<text x="700.0" y="668.0" font-size="9" fill="#0b3a66" text-anchor="start" font-weight="bold">CÓDIGO: UMC2030-P05-EXTPCH-R01</text>
<text x="700.0" y="684.0" font-size="8" fill="#5a6b7a" text-anchor="start">ESCALA: 1:20 / 1:100H-1:50V (referencial s/ impresión)</text>
<text x="700.0" y="700.0" font-size="8" fill="#5a6b7a" text-anchor="start">REV.: R01 · FECHA: 26 de octubre de 2026</text>
<text x="700.0" y="716.0" font-size="7.5" fill="#5a6b7a" text-anchor="start">PROYECTISTA: Por designar · FUENTE: Prof. J. Da Silva I. (CIV 95787)</text>
<text x="700.0" y="732.0" font-size="7.5" fill="#5a6b7a" text-anchor="start">APROBACIÓN: Rectorado UMC — Cap. Alt./Dr. G. A. Riut Hernández</text>
<rect x="20.0" y="740.0" width="560.0" height="26.0" rx="0" fill="#fff3cd" fill-opacity="1" stroke="#c9a227" stroke-width="1.5"/>
<text x="300.0" y="757.0" font-size="8.5" fill="#7a5900" text-anchor="middle" font-weight="bold">NO APTO PARA CONSTRUCCIÓN — ANTEPROYECTO · Uso institucional UMC – Marina Mercante de Venezuela</text></svg>