<text x="80.0" y="70.0" font-size="11" fill="#0b3a66" text-anchor="start" font-weight="bold">Criterios OMM (Guía de Instrumentos — referencial, vigencia por verificar RFI-NOR-01):</text>
<text x="80.0" y="96.0" font-size="10" fill="#1c2b36" text-anchor="start">• Viento a 10 m sobre terreno abierto; distancia a obstáculos ≥ 10 × altura del obstáculo (torre de 22,02 m → zona de distorsión)</text>
<text x="80.0" y="118.0" font-size="10" fill="#1c2b36" text-anchor="start">• Temperatura/humedad en abrigo ventilado a 1,25–2,00 m · precipitación alejada de superficies reflectantes</text>
<text x="80.0" y="140.0" font-size="10" fill="#1c2b36" text-anchor="start">• El emplazamiento definitivo del mástil exige estudio de obstáculos del borde Babor → RFI-OMM-01</text>
<text x="80.0" y="162.0" font-size="10" fill="#1c2b36" text-anchor="start">• Telemetría: adquisición integrada a la estación del P04 (Sala ACA-STH-15) — sin duplicar registradores</text>
<text x="80.0" y="600.0" font-size="9" fill="#5a6b7a" text-anchor="start">[FUENTE: Ficha EXT-PCH-04 §2 Altura; P04-R02 (estación)] · Alzado esquemático sin escala</text>
<text x="14.0" y="604.0" font-size="9" fill="#5a6b7a" text-anchor="start">Asta 12,00 m - mástil 10,00 m - torre colindante 22,02 m (RFI-ALT-01 heredada).</text>
